name: Mirror Offline Translator assets

# Copies the Wiktionary dictionaries and the Georgian/Swahili translation models from Offline
# Translator's catalog into the release "offline-translator-1" with a manifest of SHA-256 checksums.
on:
  push:
    branches: [main]
    paths: [mirror/**, .github/workflows/mirror.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: offline-translator-1
    steps:
      - uses: actions/checkout@v4
      - name: Download and hash
        run: python3 mirror/offline_translator.py out
      - name: Publish
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG exists: the app pins its checksums, so it is never replaced in place"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Offline Translator assets (mirror 1)" \
            --notes "Wiktionary dictionaries (CC BY-SA, via Kaikki and Offline Translator's tarkka format) and the Georgian and Swahili translation models from Offline Translator's catalog. See mirror.json for sources and SHA-256 checksums."
          ls out | head
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY"

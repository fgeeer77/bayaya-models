name: Survey translation models

# Lists candidate translation models on Hugging Face with licences and file sizes
# (convert/mt_survey.py). Run by hand; publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - run: python3 convert/mt_survey.py

name: Convert models

# Converts models that have no official sherpa-onnx build, verifies each one with sherpa-onnx
# against the original model, and publishes it as a release with SHA-256 checksums.
on:
  push:
    branches: [main]
    paths: [convert/**, .github/workflows/convert.yml]
  workflow_dispatch:
    inputs:
      only:
        description: "Model id to convert (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: whisper-ru-turbo-coriollon, kind: whisper, repo: coriollon/whisper-large-v3-turbo-russian, name: ru-turbo-coriollon, max_cer: "0.15" }
          - { id: whisper-ru-turbo-dvislobokov, kind: whisper, repo: dvislobokov/whisper-large-v3-turbo-russian, name: ru-turbo-dvislobokov, max_cer: "0.15" }
          - { id: whisper-ru-large-v3-antony66, kind: whisper, repo: antony66/whisper-large-v3-russian, name: ru-large-v3-antony66, max_cer: "0.15" }
          - { id: gigaam-multilingual-ctc, kind: gigaam, name: multilingual_ctc, max_cer: "0.05" }
          - { id: gigaam-multilingual-large-ctc, kind: gigaam, name: multilingual_large_ctc, max_cer: "0.05" }
    env:
      ID: ${{ matrix.id }}
      NAME: ${{ matrix.name }}
      REPO: ${{ matrix.repo }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: gate
        run: |
          if [ -n "${{ inputs.only }}" ] && [ "${{ inputs.only }}" != "$ID" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Free disk space
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          # Exporting and quantizing Whisper large-v3 needs more than the runner's RAM.
          sudo fallocate -l 20G /extra-swap && sudo chmod 600 /extra-swap && sudo mkswap /extra-swap && sudo swapon /extra-swap
          df -h / && free -h

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        if: steps.gate.outputs.skip != 'true'
        run: |
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
          pip install --quiet numpy==1.26.4 onnx onnxruntime==1.20.1 sherpa-onnx==1.13.8 soundfile huggingface_hub safetensors
          if [ "${{ matrix.kind }}" = whisper ]; then pip install --quiet openai-whisper transformers accelerate; fi
          if [ "${{ matrix.kind }}" = gigaam ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
            pip install --quiet git+https://github.com/salute-developers/GigaAM.git
          fi
          pip list 2>/dev/null | grep -iE "^(torch|onnx|onnxruntime|sherpa-onnx|openai-whisper|transformers|gigaam) "
          # Russian test recording used by sherpa-onnx's own GigaAM tests.
          curl -sSL -o example.wav https://huggingface.co/csukuangfj/tmp-files/resolve/main/GigaAM/example.wav

      - name: Convert Whisper
        if: steps.gate.outputs.skip != 'true' && matrix.kind == 'whisper'
        run: |
          python3 - <<'PY' > source.env
          from huggingface_hub import HfApi
          info = HfApi().model_info("${{ matrix.repo }}")
          card = info.card_data.to_dict() if info.card_data else {}
          print(f"REVISION='{info.sha}'")
          print(f"LICENSE='{card.get('license', 'not stated')}'")
          PY
          cat source.env && . ./source.env
          python3 convert/reference.py whisper "$REPO" "$REVISION" example.wav reference.txt
          python3 convert/whisper_hf_to_openai.py "$REPO" "$REVISION" "$NAME.pt"
          rm -rf ~/.cache/huggingface
          python3 convert/export_whisper.py "$NAME"
          rm -f "$NAME.pt" "$NAME-encoder.onnx" "$NAME-decoder.onnx" "$NAME"-*.weights
          python3 convert/verify.py whisper "$NAME-encoder.int8.onnx" "$NAME-decoder.int8.onnx" "$NAME-tokens.txt" example.wav reference.txt ${{ matrix.max_cer }} | tee verify.txt
          echo "SOURCE='https://huggingface.co/$REPO'" >> source.env
          echo "FILES='$NAME-encoder.int8.onnx $NAME-decoder.int8.onnx $NAME-tokens.txt'" >> source.env

      - name: Convert GigaAM
        if: steps.gate.outputs.skip != 'true' && matrix.kind == 'gigaam'
        run: |
          echo "REVISION='$(git ls-remote https://github.com/salute-developers/GigaAM HEAD | cut -f1)'" > source.env
          echo "LICENSE='mit'" >> source.env
          echo "SOURCE='https://github.com/salute-developers/GigaAM ($NAME)'" >> source.env
          python3 convert/reference.py gigaam "$NAME" example.wav reference.txt
          python3 convert/export_gigaam.py "$NAME"
          python3 convert/verify.py ctc model.int8.onnx tokens.txt example.wav reference.txt ${{ matrix.max_cer }} | tee verify.txt
          echo "FILES='model.int8.onnx tokens.txt'" >> source.env

      - name: Publish release
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -a; . ./source.env; set +a
          python3 - <<'PY'
          import hashlib, json, os
          files = []
          for name in os.environ["FILES"].split():
              h = hashlib.sha256()
              with open(name, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              files.append({"path": name, "size": os.path.getsize(name), "sha256": h.hexdigest()})
          manifest = {"id": os.environ["ID"], "source": os.environ["SOURCE"], "sourceRevision": os.environ["REVISION"],
                      "license": os.environ["LICENSE"], "converter": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                      "commit": os.environ["GITHUB_SHA"], "files": files}
          json.dump(manifest, open(f"{os.environ['ID']}.json", "w"), indent=1)
          print(json.dumps(manifest, indent=1))
          PY
          sha256sum $FILES "$ID.json" > SHA256SUMS
          {
            echo "Converted automatically from $SOURCE (revision $REVISION, licence $LICENSE)."
            echo
            echo "Verified with sherpa-onnx 1.13.8 against the original model on the same recording:"
            echo '```'; cat verify.txt; echo '```'
            echo '```'; cat SHA256SUMS; echo '```'
          } > notes.md
          if gh release view "$ID" > /dev/null 2>&1; then
            gh release upload "$ID" $FILES "$ID.json" SHA256SUMS --clobber
            gh release edit "$ID" --notes-file notes.md
          else
            gh release create "$ID" $FILES "$ID.json" SHA256SUMS --title "$ID" --notes-file notes.md
          fi
          echo "MANIFEST-BEGIN"; cat "$ID.json"; echo "MANIFEST-END"
